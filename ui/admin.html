<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BrainC — Admin Panel</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0d0d0d;
      --surface: #141414;
      --surface2: #1a1a1a;
      --border: #2a2a2a;
      --text: #e8e8e8;
      --muted: #888;
      --accent: #6e8efb;
      --accent-hover: #8aa4ff;
      --danger: #f87171;
      --danger-hover: #fca5a5;
      --success: #4ade80;
      --input-bg: #1e1e1e;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 0.9rem;
      min-height: 100vh;
    }

    /* ── Top nav ── */
    header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 0 1.5rem;
      height: 52px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .nav-left { display: flex; align-items: center; gap: 1rem; }
    .nav-logo { font-weight: 700; font-size: 1rem; }
    .nav-badge {
      background: rgba(110, 142, 251, 0.15);
      color: var(--accent);
      border: 1px solid rgba(110, 142, 251, 0.3);
      border-radius: 4px;
      padding: 2px 8px;
      font-size: 0.7rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .nav-right { display: flex; align-items: center; gap: 0.75rem; }
    .nav-user { color: var(--muted); font-size: 0.8rem; }

    .btn {
      padding: 0.4rem 0.9rem;
      border-radius: 6px;
      font-size: 0.8rem;
      cursor: pointer;
      border: none;
      transition: background 0.15s, opacity 0.15s;
    }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .btn-ghost {
      background: transparent;
      color: var(--muted);
      border: 1px solid var(--border);
    }
    .btn-ghost:hover { color: var(--text); border-color: #444; }
    .btn-accent { background: var(--accent); color: #fff; }
    .btn-accent:hover { background: var(--accent-hover); }
    .btn-danger { background: transparent; color: var(--danger); border: 1px solid rgba(248,113,113,0.3); }
    .btn-danger:hover { background: rgba(248,113,113,0.1); }
    .btn-sm { padding: 0.3rem 0.65rem; font-size: 0.75rem; }

    /* ── Layout ── */
    main {
      max-width: 1100px;
      margin: 0 auto;
      padding: 2rem 1.5rem;
    }

    h2 {
      font-size: 1.1rem;
      font-weight: 600;
      margin-bottom: 1rem;
      color: var(--text);
    }

    /* ── Stats row ── */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 1rem;
      margin-bottom: 2.5rem;
    }

    .stat-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 1.25rem 1rem;
    }

    .stat-label { font-size: 0.75rem; color: var(--muted); margin-bottom: 0.4rem; }
    .stat-value { font-size: 1.75rem; font-weight: 700; }

    /* ── Users section ── */
    .section {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      overflow: hidden;
      margin-bottom: 2rem;
    }

    .section-header {
      padding: 1rem 1.25rem;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .section-title { font-weight: 600; font-size: 0.95rem; }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    th {
      text-align: left;
      padding: 0.65rem 1.25rem;
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.4px;
      border-bottom: 1px solid var(--border);
    }

    td {
      padding: 0.8rem 1.25rem;
      border-bottom: 1px solid var(--border);
      vertical-align: middle;
    }

    tr:last-child td { border-bottom: none; }
    tr:hover td { background: var(--surface2); }

    .role-badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 0.7rem;
      font-weight: 600;
      text-transform: uppercase;
    }

    .role-admin { background: rgba(110,142,251,0.15); color: var(--accent); }
    .role-user { background: rgba(255,255,255,0.06); color: var(--muted); }

    .actions { display: flex; gap: 0.5rem; }

    /* ── Create user form ── */
    .create-form {
      padding: 1.25rem;
      display: grid;
      grid-template-columns: 1fr 1fr 1fr auto auto;
      gap: 0.75rem;
      align-items: end;
    }

    .form-field { display: flex; flex-direction: column; gap: 0.3rem; }
    .form-field label { font-size: 0.75rem; color: var(--muted); }

    input[type="text"], input[type="password"], select {
      background: var(--input-bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
      font-size: 0.85rem;
      padding: 0.5rem 0.75rem;
      outline: none;
      width: 100%;
    }

    input:focus, select:focus { border-color: var(--accent); }
    select { cursor: pointer; }

    /* ── Reset modal ── */
    .modal-overlay {
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.6);
      display: flex; align-items: center; justify-content: center;
      z-index: 100;
    }

    .modal {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.75rem;
      width: 360px;
    }

    .modal h3 { font-size: 1rem; margin-bottom: 1.25rem; }
    .modal .form-group { margin-bottom: 1rem; }
    .modal .form-group label { display: block; font-size: 0.8rem; color: var(--muted); margin-bottom: 0.35rem; }
    .modal-footer { display: flex; gap: 0.75rem; justify-content: flex-end; margin-top: 1.25rem; }

    .toast {
      position: fixed;
      bottom: 1.5rem;
      right: 1.5rem;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.75rem 1.25rem;
      font-size: 0.85rem;
      z-index: 200;
      transition: opacity 0.3s;
    }

    .toast.success { border-color: rgba(74,222,128,0.4); color: var(--success); }
    .toast.error { border-color: rgba(248,113,113,0.4); color: var(--danger); }
  </style>
</head>
<body>

<header>
  <div class="nav-left">
    <span class="nav-logo">BrainC</span>
    <span class="nav-badge">Admin</span>
  </div>
  <div class="nav-right">
    <span class="nav-user" id="nav-user"></span>
    <a href="/" class="btn btn-ghost">Chat</a>
    <button class="btn btn-ghost" onclick="logout()">Sign Out</button>
  </div>
</header>

<main>
  <!-- Stats -->
  <h2>System Overview</h2>
  <div class="stats-grid">
    <div class="stat-card">
      <div class="stat-label">Total Users</div>
      <div class="stat-value" id="stat-users">—</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Conversations</div>
      <div class="stat-value" id="stat-convs">—</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Messages</div>
      <div class="stat-value" id="stat-msgs">—</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Model</div>
      <div class="stat-value" style="font-size:1rem;padding-top:0.3rem" id="stat-model">—</div>
    </div>
  </div>

  <!-- Create user -->
  <div class="section">
    <div class="section-header">
      <span class="section-title">Create User</span>
    </div>
    <form class="create-form" onsubmit="createUser(event)">
      <div class="form-field">
        <label>Username</label>
        <input id="new-username" type="text" required minlength="3" maxlength="32" placeholder="username" />
      </div>
      <div class="form-field">
        <label>Display Name</label>
        <input id="new-display" type="text" required maxlength="64" placeholder="Display Name" />
      </div>
      <div class="form-field">
        <label>Password</label>
        <input id="new-password" type="password" required minlength="8" placeholder="min 8 chars" />
      </div>
      <div class="form-field">
        <label>Role</label>
        <select id="new-role">
          <option value="user">User</option>
          <option value="admin">Admin</option>
        </select>
      </div>
      <div class="form-field" style="padding-top:1.4rem">
        <button type="submit" class="btn btn-accent">Create</button>
      </div>
    </form>
  </div>

  <!-- Users table -->
  <div class="section">
    <div class="section-header">
      <span class="section-title">Users</span>
      <button class="btn btn-ghost btn-sm" onclick="loadUsers()">Refresh</button>
    </div>
    <table>
      <thead>
        <tr>
          <th>Username</th>
          <th>Display Name</th>
          <th>Role</th>
          <th>Conversations</th>
          <th>Last Login</th>
          <th>Created</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody id="users-tbody">
        <tr><td colspan="7" style="color:var(--muted);text-align:center;padding:2rem">Loading...</td></tr>
      </tbody>
    </table>
  </div>
</main>

<!-- Reset password modal -->
<div class="modal-overlay" id="reset-modal" style="display:none">
  <div class="modal">
    <h3>Reset Password</h3>
    <div class="form-group">
      <label>New Password (min 8 chars)</label>
      <input id="reset-password" type="password" required minlength="8" />
    </div>
    <div class="modal-footer">
      <button class="btn btn-ghost" onclick="closeResetModal()">Cancel</button>
      <button class="btn btn-accent" onclick="confirmReset()">Reset</button>
    </div>
  </div>
</div>

<script>
  const API_BASE = "http://localhost:8000";

  // ── Auth (module-level token, read from sessionStorage handoff) ────────────
  let authToken = sessionStorage.getItem("braincToken") || "";
  let currentUser = null;

  try {
    const stored = sessionStorage.getItem("braincUser");
    if (stored) currentUser = JSON.parse(stored);
  } catch (_) {}

  function authHeaders() {
    return { "Content-Type": "application/json", "Authorization": `Bearer ${authToken}` };
  }

  async function apiGet(path) {
    const res = await fetch(`${API_BASE}${path}`, { headers: authHeaders() });
    if (res.status === 401) { redirectToLogin(); return null; }
    return res;
  }

  async function apiPost(path, body) {
    const res = await fetch(`${API_BASE}${path}`, {
      method: "POST", headers: authHeaders(), body: JSON.stringify(body),
    });
    if (res.status === 401) { redirectToLogin(); return null; }
    return res;
  }

  async function apiDelete(path) {
    const res = await fetch(`${API_BASE}${path}`, { method: "DELETE", headers: authHeaders() });
    if (res.status === 401) { redirectToLogin(); return null; }
    return res;
  }

  function redirectToLogin() {
    sessionStorage.clear();
    window.location.replace("/login");
  }

  // ── Init ──────────────────────────────────────────────────────────────────
  (async function init() {
    if (!authToken) { redirectToLogin(); return; }

    // Verify admin
    const meRes = await apiGet("/auth/me");
    if (!meRes) return;
    const me = await meRes.json();
    if (me.role !== "admin") { window.location.replace("/"); return; }
    currentUser = me;
    document.getElementById("nav-user").textContent = me.display_name;

    await Promise.all([loadStats(), loadUsers()]);
  })();

  async function loadStats() {
    try {
      const res = await apiGet("/health");
      if (!res) return;
      const data = await res.json();
      document.getElementById("stat-users").textContent = data.total_users ?? "—";
      document.getElementById("stat-convs").textContent = data.total_conversations ?? "—";
      document.getElementById("stat-msgs").textContent = data.total_messages ?? "—";
      document.getElementById("stat-model").textContent = data.model ?? "—";
    } catch (_) {}
  }

  async function loadUsers() {
    const res = await apiGet("/auth/users");
    if (!res) return;
    const data = await res.json();
    renderUsers(data.users || []);
  }

  function fmtDate(iso) {
    if (!iso) return "Never";
    return new Date(iso).toLocaleDateString(undefined, { month: "short", day: "numeric", year: "numeric" });
  }

  function renderUsers(users) {
    const tbody = document.getElementById("users-tbody");
    if (!users.length) {
      tbody.innerHTML = `<tr><td colspan="7" style="color:var(--muted);text-align:center;padding:2rem">No users found</td></tr>`;
      return;
    }
    tbody.innerHTML = users.map(u => `
      <tr data-id="${u.id}">
        <td><strong>${escHtml(u.username)}</strong></td>
        <td>${escHtml(u.display_name)}</td>
        <td><span class="role-badge role-${u.role}">${u.role}</span></td>
        <td>${u.conversation_count ?? 0}</td>
        <td>${fmtDate(u.last_login)}</td>
        <td>${fmtDate(u.created_at)}</td>
        <td>
          <div class="actions">
            <button class="btn btn-ghost btn-sm" onclick="openResetModal(${u.id})">Reset PW</button>
            ${currentUser && u.id !== currentUser.id
              ? `<button class="btn btn-danger btn-sm" onclick="deleteUser(${u.id}, '${escHtml(u.username)}')">Delete</button>`
              : ''}
          </div>
        </td>
      </tr>
    `).join("");
  }

  function escHtml(str) {
    return String(str).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
  }

  async function createUser(e) {
    e.preventDefault();
    const body = {
      username: document.getElementById("new-username").value.trim(),
      display_name: document.getElementById("new-display").value.trim(),
      password: document.getElementById("new-password").value,
      role: document.getElementById("new-role").value,
    };
    const res = await apiPost("/auth/users", body);
    if (!res) return;
    const data = await res.json();
    if (!res.ok) { showToast(data.detail || "Failed to create user", "error"); return; }
    showToast(`User "${body.username}" created`, "success");
    e.target.reset();
    await loadUsers();
    await loadStats();
  }

  async function deleteUser(userId, username) {
    if (!confirm(`Delete user "${username}" and all their data? This cannot be undone.`)) return;
    const res = await apiDelete(`/auth/users/${userId}`);
    if (!res) return;
    if (!res.ok) {
      const d = await res.json();
      showToast(d.detail || "Delete failed", "error");
      return;
    }
    showToast(`User "${username}" deleted`, "success");
    await loadUsers();
    await loadStats();
  }

  // ── Reset password modal ──────────────────────────────────────────────────
  let resetTargetId = null;

  function openResetModal(userId) {
    resetTargetId = userId;
    document.getElementById("reset-password").value = "";
    document.getElementById("reset-modal").style.display = "flex";
  }

  function closeResetModal() {
    resetTargetId = null;
    document.getElementById("reset-modal").style.display = "none";
  }

  async function confirmReset() {
    const pw = document.getElementById("reset-password").value;
    if (pw.length < 8) { showToast("Password must be at least 8 characters", "error"); return; }
    const res = await apiPost(`/auth/users/${resetTargetId}/reset-password`, { new_password: pw });
    if (!res) return;
    if (!res.ok) {
      const d = await res.json();
      showToast(d.detail || "Reset failed", "error");
      return;
    }
    showToast("Password reset successfully", "success");
    closeResetModal();
  }

  // ── Logout ────────────────────────────────────────────────────────────────
  async function logout() {
    const rt = sessionStorage.getItem("braincRefreshToken");
    if (rt) {
      try {
        await fetch(`${API_BASE}/auth/logout`, {
          method: "POST",
          headers: authHeaders(),
          body: JSON.stringify({ refresh_token: rt }),
        });
      } catch (_) {}
    }
    sessionStorage.clear();
    window.location.replace("/login");
  }

  // ── Toast ──────────────────────────────────────────────────────────────────
  let toastTimer = null;
  function showToast(msg, type = "success") {
    let el = document.getElementById("toast");
    if (!el) {
      el = document.createElement("div");
      el.id = "toast";
      el.className = "toast";
      document.body.appendChild(el);
    }
    el.textContent = msg;
    el.className = `toast ${type}`;
    el.style.opacity = "1";
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { el.style.opacity = "0"; }, 3000);
  }

  // Close modal on backdrop click
  document.getElementById("reset-modal").addEventListener("click", (e) => {
    if (e.target === document.getElementById("reset-modal")) closeResetModal();
  });
</script>
</body>
</html>
