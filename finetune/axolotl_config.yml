# BrainC v0.3 — Axolotl LoRA Fine-Tuning Config
# Usage: axolotl train finetune/axolotl_config.yml
# Docs:  https://axolotl-ai-cloud.github.io/axolotl/

# ── Base model ─────────────────────────────────────────────────────────────
base_model: unsloth/Qwen2.5-14B-Instruct
model_type: AutoModelForCausalLM
tokenizer_type: AutoTokenizer

# ── Quantization ───────────────────────────────────────────────────────────
load_in_8bit: false
load_in_4bit: true
strict: false

# ── Dataset ────────────────────────────────────────────────────────────────
datasets:
  - path: finetune/datasets/sharegpt_dataset.json
    type: sharegpt
    conversation: chatml

dataset_prepared_path: finetune/datasets/.prepared
val_set_size: 0.02
output_dir: finetune/output/axolotl_output

# ── Sequence ───────────────────────────────────────────────────────────────
sequence_len: 4096
sample_packing: true
pad_to_sequence_len: true

# ── LoRA adapter ───────────────────────────────────────────────────────────
adapter: lora
lora_r: 16
lora_alpha: 32
lora_dropout: 0.05
lora_target_modules:
  - q_proj
  - k_proj
  - v_proj
  - o_proj

# ── Training hyperparameters ───────────────────────────────────────────────
micro_batch_size: 2
gradient_accumulation_steps: 4
num_epochs: 3
learning_rate: 2e-4
lr_scheduler: cosine
warmup_steps: 20

# ── Precision ──────────────────────────────────────────────────────────────
bf16: true
tf32: false

# ── Performance ────────────────────────────────────────────────────────────
flash_attention: true
gradient_checkpointing: true

# ── Logging and checkpointing ──────────────────────────────────────────────
logging_steps: 10
eval_steps: 50
save_steps: 100
save_total_limit: 3

# ── Experiment tracking (disabled for local-only training) ─────────────────
wandb_project:
wandb_run_id:
wandb_mode: disabled
use_wandb: false
