name: BrainC R9 Skill Passport Consumer
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-passport-replay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test passive Skill Passport consumer
        run: python3 -m unittest discover -s tests -p 'test_skill_passport_verify.py' -v
      - name: Syntax-check passive verifier
        run: python3 -m py_compile scripts/skill_passport_verify.py
