name: BrainC Local Inference Adapter

on:
  pull_request:
    paths:
      - 'api/core/inference.py'
      - 'api/routes/chat.py'
      - 'api/routes/models.py'
      - 'api/core/health.py'
      - 'api/main.py'
      - 'tests/test_phiserve_inference.py'
      - '.github/workflows/phiserve-adapter.yml'
  push:
    branches: [main]
    paths:
      - 'api/core/inference.py'
      - 'api/routes/chat.py'
      - 'api/routes/models.py'
      - 'api/core/health.py'
      - 'api/main.py'
      - 'tests/test_phiserve_inference.py'
      - '.github/workflows/phiserve-adapter.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  adapter:
    name: PhiServe contract / ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install only lightweight HTTP test dependency
        run: python -m pip install "httpx>=0.27,<1"
      - name: Compile changed integration modules
        run: python -m compileall -q api
      - name: Test local authenticated provider, persona, NDJSON and no fallback
        run: python -m unittest discover -s tests -p "test_phiserve_inference.py" -v
