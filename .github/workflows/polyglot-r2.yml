name: BrainC Memory Polyglot R2 Consumer
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  polyglot-consumer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install narrow contract test dependency
        run: python3 -m pip install 'pytest>=8,<10'
      - name: Check synthetic-only R2 reader contract
        run: python3 -m pytest -q tests/test_polyglot_consumer_r2.py
