name: BrainC R12 Signed Governance Ledger
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  signed-inspection-history:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python3 -m pip install 'cryptography>=42,<47'
      - name: Validate pinned Ed25519 operator chain, independent checkpoints and revocation
        run: python3 -m unittest discover -s tests -p 'test_r12_governance.py' -v
      - name: Check isolated Python module syntax
        run: python3 -m py_compile scripts/r12_governance.py
