name: BrainC Memory Polyglot R3 Courier
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  signed-courier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install isolated parser test dependencies
        run: python -m pip install 'cryptography>=43,<47' 'pytest>=8,<10'
      - name: Verify signed encrypted offline test vector
        run: python -m pytest -q tests/test_polyglot_consumer_r2.py tests/test_polyglot_courier_r3.py
