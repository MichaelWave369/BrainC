name: BrainC R11 Governed Inspection Enrollment
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  passive-inspection-enrollment:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python3 -m pip install 'cryptography>=42,<47'
      - name: Test deny-by-default, expiry and revocation
        run: python3 -m unittest discover -s tests -p 'test_r11_enrollment.py' -v
      - name: Syntax-check local operator CLI
        run: python3 -m py_compile scripts/r11_enrollment.py
